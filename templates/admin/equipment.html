<!DOCTYPE html>

<html>

<head>

    <title>Manage Equipment</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>


<aside class="sidebar">

    <div class="logo">

        <div class="logo-icon">
            🧪
        </div>

        <h2>Lab Portal</h2>

        <p>Admin Panel</p>

    </div>


    <ul class="sidebar-menu">

        <li>
            <a href="/admin/dashboard">
                <span>📊</span>
                Dashboard
            </a>
        </li>

        <li>
            <a href="/admin/equipment"
               class="active">
                <span>🧪</span>
                Equipment
            </a>
        </li>

        <li>
            <a href="/admin/bookings">
                <span>📋</span>
                Bookings
            </a>
        </li>

        <li>
            <a href="/admin/users">
                <span>👥</span>
                Students
            </a>
        </li>

        <li>
            <a href="/student/login">
                <span>🚪</span>
                Logout
            </a>
        </li>

    </ul>

</aside>


<main class="main-content">


    <header class="topbar">

        <div class="topbar-title">
            Equipment Management
        </div>

    </header>


    <div class="container">


        <div class="section-header">

            <div>

                <h1 class="page-title">
                    Equipment
                </h1>

                <p class="page-subtitle">
                    Manage laboratory equipment.
                </p>

            </div>


            <a href="/admin/equipment/add">

                <button>
                    + Add Equipment
                </button>

            </a>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Total</th>
                        <th>Available</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="adminEquipmentTable">

                    <tr>

                        <td colspan="7">
                            Loading equipment...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>

</main>


<script src="{{ url_for('static',
filename='js/admin/admin.js') }}">
</script>


</body>

</html>
