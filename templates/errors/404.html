{% extends "base.html" %}

{% block title %}404 Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        <div class="card p-5 border-0 shadow-sm">
            <i class="bi bi-question-circle text-warning display-1 mb-3"></i>
            <h1 class="display-5 fw-bold text-dark mb-2">404</h1>
            <h4 class="text-secondary mb-3">Page Not Found</h4>
            <p class="text-muted mb-4">
                The laboratory equipment or page you are looking for does not exist or has been moved.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{% if session_role == 'admin' %}{{ url_for('admin.dashboard') }}{% else %}{{ url_for('student.dashboard') }}{% endif %}" class="btn btn-primary">
                    <i class="bi bi-house-door me-1"></i> Back to Dashboard
                </a>
                <a href="{{ url_for('student.equipment') }}" class="btn btn-outline-secondary">
                    Browse Equipment
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
