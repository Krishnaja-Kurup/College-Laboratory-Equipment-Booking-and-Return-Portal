{% extends "base.html" %}

{% block title %}500 Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        <div class="card p-5 border-0 shadow-sm">
            <i class="bi bi-exclamation-triangle-fill text-danger display-1 mb-3"></i>
            <h1 class="display-5 fw-bold text-dark mb-2">500</h1>
            <h4 class="text-secondary mb-3">Internal Server Error</h4>
            <p class="text-muted mb-4">
                Something went wrong on the server while processing your request. Please try again or return to the main dashboard.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{% if session_role == 'admin' %}{{ url_for('admin.dashboard') }}{% else %}{{ url_for('student.dashboard') }}{% endif %}" class="btn btn-primary">
                    <i class="bi bi-house-door me-1"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
