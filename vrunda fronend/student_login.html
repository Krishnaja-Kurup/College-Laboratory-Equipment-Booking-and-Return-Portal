<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Lab Equipment Portal</h1>

        <h2>Student Login</h2>

        <form id="loginForm">

            <label>Email</label>

            <input type="email"
                   id="email"
                   placeholder="Enter your email"
                   required>

            <label>Password</label>

            <input type="password"
                   id="password"
                   placeholder="Enter password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

    </div>

</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
